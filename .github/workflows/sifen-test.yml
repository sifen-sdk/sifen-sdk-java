name: SIFEN test environment

# Sends real documents to SIFEN's TEST environment with the maintainer's credentials.
# Never runs for pull requests from forks: only manually or on schedule, on main, inside
# the protected "sifen-test" environment that holds the secrets.
on:
  workflow_dispatch:
    inputs:
      wait:
        description: "Wait 11 minutes and query the batch result"
        type: boolean
        default: true
  schedule:
    - cron: "23 11 * * 1"

permissions:
  contents: read

concurrency:
  group: sifen-test
  cancel-in-progress: false

jobs:
  live:
    if: github.repository == 'sifen-sdk/sifen-sdk-java' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sifen-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Issue documents in the SIFEN test environment
        env:
          SIFEN_TEST_P12_BASE64: ${{ secrets.SIFEN_TEST_P12_BASE64 }}
          SIFEN_TEST_P12_PASSWORD: ${{ secrets.SIFEN_TEST_P12_PASSWORD }}
          SIFEN_TEST_CSC_ID: ${{ secrets.SIFEN_TEST_CSC_ID }}
          SIFEN_TEST_CSC: ${{ secrets.SIFEN_TEST_CSC }}
          SIFEN_TEST_ISSUER: ${{ secrets.SIFEN_TEST_ISSUER }}
          SIFEN_TEST_WAIT: ${{ github.event_name == 'schedule' || inputs.wait }}
        run: >-
          ./mvnw -B -ntp -pl sifen-sdk-client -am verify
          -Dtest=LiveSifenTest -Dsurefire.failIfNoSpecifiedTests=false
